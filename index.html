<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description"
        content="Live departures, journey planning and vehicle radar for Berlin & Brandenburg. Your independent companion for every U-Bahn, S-Bahn, tram and bus connection." />
    <meta name="theme-color" content="#f6f5f1" />
    <meta name="application-name" content="BVG Dashboard" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BVG Dashboard" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>BVG Dashboard · Berlin, on your terms.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <script>
        let theme;
        try {
            theme = localStorage.getItem('theme');
        } catch { }
        document.documentElement.classList.toggle(
            'dark',
            theme === 'dark' ||
            (!['light', 'dark'].includes(theme) &&
                !window.matchMedia?.('(prefers-color-scheme: light)')?.matches)
        );
    </script>
</head>

<body>
    <div id="app"></div>
    <noscript>
        This dashboard needs JavaScript to show live transit data and plan journeys.
    </noscript>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
